name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  ci:
    uses: LegionIO/.github/.github/workflows/ci.yml@e0fc7364b73f446d4cb9bdc162a66ed34bf0daa7
    with:
      companion-gems: ${{ github.event_name == 'pull_request' && '{"legion-settings":{"repository":"LegionIO/legion-settings","ref":"8e73a9ef3c13958e3e1e7fc98532e41283159706"},"legion-data":{"repository":"LegionIO/legion-data","ref":"b05212cba104973b2180bc56553ad4e657807eff"},"lex-conditioner":{"repository":"LegionIO/lex-conditioner","ref":"7e183ed17d3263b46a046648de96e6cdd16fb9ab"}}' || '{}' }}

  excluded-files:
    uses: LegionIO/.github/.github/workflows/excluded-files.yml@main

  security:
    uses: LegionIO/.github/.github/workflows/security-scan.yml@e0fc7364b73f446d4cb9bdc162a66ed34bf0daa7
    with:
      companion-gems: ${{ github.event_name == 'pull_request' && '{"legion-settings":{"repository":"LegionIO/legion-settings","ref":"8e73a9ef3c13958e3e1e7fc98532e41283159706"},"legion-data":{"repository":"LegionIO/legion-data","ref":"b05212cba104973b2180bc56553ad4e657807eff"},"lex-conditioner":{"repository":"LegionIO/lex-conditioner","ref":"7e183ed17d3263b46a046648de96e6cdd16fb9ab"}}' || '{}' }}

  version-changelog:
    uses: LegionIO/.github/.github/workflows/version-changelog.yml@main

  dependency-review:
    uses: LegionIO/.github/.github/workflows/dependency-review.yml@main

  stale:
    if: github.event_name == 'schedule'
    uses: LegionIO/.github/.github/workflows/stale.yml@main

  release:
    needs: [ci, excluded-files]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: LegionIO/.github/.github/workflows/release.yml@main
    secrets:
      rubygems-api-key: ${{ secrets.RUBYGEMS_API_KEY }}
