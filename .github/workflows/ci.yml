name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  ci:
    uses: LegionIO/.github/.github/workflows/ci.yml@e0fc7364b73f446d4cb9bdc162a66ed34bf0daa7
    with:
      companion-gems: ${{ github.event_name == 'pull_request' && '{"legion-settings":{"repository":"LegionIO/legion-settings","ref":"b5369f610ccd9aad7de1623e61fa06ac2089d9d1"},"legion-data":{"repository":"LegionIO/legion-data","ref":"697bb472972b83c55f57f7f1ecf856325a7f860b"},"legion-transport":{"repository":"LegionIO/legion-transport","ref":"a6eeb3377b1822ed0557a9ef5551f134f5d8b4af"},"lex-conditioner":{"repository":"LegionIO/lex-conditioner","ref":"09e2a07a1cdc29a5cdb6e66e375355b1dcabcf1d"}}' || '{}' }}

  excluded-files:
    uses: LegionIO/.github/.github/workflows/excluded-files.yml@main

  security:
    uses: LegionIO/.github/.github/workflows/security-scan.yml@e0fc7364b73f446d4cb9bdc162a66ed34bf0daa7
    with:
      companion-gems: ${{ github.event_name == 'pull_request' && '{"legion-settings":{"repository":"LegionIO/legion-settings","ref":"b5369f610ccd9aad7de1623e61fa06ac2089d9d1"},"legion-data":{"repository":"LegionIO/legion-data","ref":"697bb472972b83c55f57f7f1ecf856325a7f860b"},"legion-transport":{"repository":"LegionIO/legion-transport","ref":"a6eeb3377b1822ed0557a9ef5551f134f5d8b4af"},"lex-conditioner":{"repository":"LegionIO/lex-conditioner","ref":"09e2a07a1cdc29a5cdb6e66e375355b1dcabcf1d"}}' || '{}' }}

  version-changelog:
    uses: LegionIO/.github/.github/workflows/version-changelog.yml@main

  dependency-review:
    uses: LegionIO/.github/.github/workflows/dependency-review.yml@main

  stale:
    if: github.event_name == 'schedule'
    uses: LegionIO/.github/.github/workflows/stale.yml@main

  release:
    needs: [ci, excluded-files]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: LegionIO/.github/.github/workflows/release.yml@main
    secrets:
      rubygems-api-key: ${{ secrets.RUBYGEMS_API_KEY }}
